# Production profile: fail startup if a required secret or production connection setting is missing.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${FRONTEND_URL}
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.webhook-secret=${PAYSTACK_WEBHOOK_SECRET}
paystack.callback-url=${PAYSTACK_CALLBACK_URL}
app.data-encryption-key=${APP_DATA_ENCRYPTION_KEY}
