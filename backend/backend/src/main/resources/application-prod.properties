# Production database and authentication settings remain mandatory.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${FRONTEND_URL}

# Student catalogue preview is available without payment gateway credentials.
# Checkout remains disabled unless PAYSTACK_ENABLED=true is deliberately configured.
paystack.enabled=${PAYSTACK_ENABLED:false}
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.webhook-secret=${PAYSTACK_WEBHOOK_SECRET:}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:}
app.data-encryption-key=${APP_DATA_ENCRYPTION_KEY:}
