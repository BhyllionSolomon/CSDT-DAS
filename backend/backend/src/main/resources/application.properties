# ==========================================
# APPLICATION
# ==========================================
spring.application.name=backend

# ==========================================
# SERVER
# Local default remains http://localhost:8081
# Render supplies PORT automatically.
# ==========================================
server.port=${PORT:8081}

# ==========================================
# POSTGRESQL
# Local defaults preserve existing localhost development.
# Configure SPRING_DATASOURCE_URL, USERNAME and PASSWORD on Render.
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/csdtdas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==========================================
# SQL INITIALIZATION
# ==========================================
spring.sql.init.mode=always

# ==========================================
# ACTUATOR - expose health only; never expose environment values
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ==========================================
# PREDICTION SERVICE
# Override PREDICTION_SERVICE_URL in deployments if a prediction API is configured.
# ==========================================
prediction.service.url=${PREDICTION_SERVICE_URL:http://localhost:8000}

# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
jwt.secret=${JWT_SECRET:local-development-only-change-this-to-a-long-random-secret}
jwt.expiration-ms=3600000

app.upload-dir=${APP_UPLOAD_DIR:./uploads}
app.video.base-url=https://meet.jit.si
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
